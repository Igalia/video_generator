on:
  workflow_dispatch:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

name: Create Release
env:
  REPO_NAME: video_generator
  PRETTY_NAME: video_generator
jobs:
  build-release:
    name: Build release
    uses: ./.github/workflows/main.yml
    with:
      package: true
  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build-release
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.REPO_NAME }}-release-*
          path: artifacts
          merge-multiple: true
      - name: Rename to tagged filenames
        shell: bash
        run: |
          for zip in artifacts/$REPO_NAME-release-*.zip; do
            platform="${zip#artifacts/$REPO_NAME-release-}"
            platform="${platform%.zip}"
            mv "$zip" "artifacts/$REPO_NAME-${{ github.ref_name }}-$platform.zip"
          done
      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ env.PRETTY_NAME }} ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*.zip
