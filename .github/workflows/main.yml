name: "video_generator native build"
run-name: Native build by ${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Install, compress and upload the build as a release artifact"
        type: boolean
        default: false
  workflow_call:
    inputs:
      package:
        description: "Install, compress and upload the build as a release artifact"
        type: boolean
        default: false
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
env:
  REPO_NAME: video_generator
permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # git-clang-format needs history to find the merge base.
          fetch-depth: 0
      - name: Install Clang-Format
        # Pinned: formatting of macro bodies changed in 17 and again in 18,
        # so an unpinned version rejects code the previous one accepted.
        run: sudo apt-get update && sudo apt-get -y install clang-format-14
      - name: Run Clang-Format
        run: |
          # Only check lines this branch touches; the existing tree predates
          # any style config and is grandfathered in.
          git fetch --no-tags origin ${{ github.event.repository.default_branch }}
          base=$(git merge-base HEAD FETCH_HEAD) || {
            echo "::error::no common ancestor with the default branch"
            exit 1
          }
          # Exits 1 when it emits a diff, so the exit code can't distinguish
          # "needs formatting" from a real failure; the diff test does.
          git clang-format-14 --binary clang-format-14 --diff "$base" \
            -- ':!src/examples/getopt_long.*' > format.diff || true
          cat format.diff
          if grep -q '^--- ' format.diff; then
            echo "::error::Changed lines are not clang-formatted; run: git clang-format-14 --binary clang-format-14 $base"
            exit 1
          fi

  ci-linux:
    strategy:
      matrix:
        platform: [linux-x86_64, linux-x86]
    runs-on: ubuntu-22.04

    env:
      TERM: dumb

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set i386 environment variables
        if: matrix.platform == 'linux-x86'
        run: |
          echo "CC=cc -m32" >> $GITHUB_ENV
          echo "CXX=c++ -m32" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/lib/i386-linux-gnu/pkgconfig/" >> $GITHUB_ENV

      - name: Install i386 dependencies
        if: matrix.platform == 'linux-x86'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install gcc-multilib g++-multilib libc6-dbg:i386
          # hack to avoid that zlib x64 gets picked up
          sudo apt remove --assume-yes zlib1g-dev

      - name: Build release
        shell: bash
        run: |
          mkdir -p BUILD_RELEASE
          pushd BUILD_RELEASE
          cmake -DCMAKE_BUILD_TYPE=Release ..
          cmake --build . --config Release
          popd
      - name: Install release
        if: inputs.package
        shell: bash
        run: |
          pushd BUILD_RELEASE
          cmake --install . --prefix ./${{ env.REPO_NAME }}-release
          popd
      - name: Create zip
        if: inputs.package
        shell: bash
        run: |
          pushd BUILD_RELEASE
          zip -r ../${{ env.REPO_NAME }}-release-${{ matrix.platform }}.zip ${{ env.REPO_NAME }}-release/
          popd

      - name: Upload artifact
        if: inputs.package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.REPO_NAME }}-release-${{ matrix.platform }}
          path: ${{ env.REPO_NAME }}-release-${{ matrix.platform }}.zip
          retention-days: 7

  ci-windows:
    strategy:
      matrix:
        platform: [windows-x64, windows-x86]
        include:
          - platform: windows-x64
            cmake_arch: x64
          - platform: windows-x86
            cmake_arch: Win32

    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          choco install --yes zip

      - name: Build release
        shell: bash
        run: |
          mkdir -p BUILD_RELEASE
          pushd BUILD_RELEASE
          echo "platform=[${{ matrix.platform }}] cmake_arch=[${{ matrix.cmake_arch }}]"
          cmake -A "${{ matrix.cmake_arch }}" ..
          cmake --build . --config Release
          popd
      - name: Install release
        if: inputs.package
        shell: bash
        run: |
          pushd BUILD_RELEASE
          cmake --install . --config Release --prefix ./${{ env.REPO_NAME }}-release
          popd
      - name: Create zip
        if: inputs.package
        shell: bash
        run: |
          pushd BUILD_RELEASE
          zip -r ../${{ env.REPO_NAME }}-release-${{ matrix.platform }}.zip ${{ env.REPO_NAME }}-release/
          popd

      - name: Upload artifact
        if: inputs.package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.REPO_NAME }}-release-${{ matrix.platform }}
          path: ${{ env.REPO_NAME }}-release-${{ matrix.platform }}.zip
          retention-days: 7
